<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bright Patch — Unlock</title>
<link rel="icon" href="icon-192.png" type="image/png">
<style>
body{margin:0;background:#F7EFDF;color:#33281B;font-family:"Atkinson Hyperlegible",Verdana,sans-serif;font-size:20px;line-height:1.5;display:grid;place-items:center;min-height:100vh}
main{text-align:center;padding:24px;max-width:34em}
.sun{font-size:64px}
a.btn{display:inline-block;margin-top:14px;background:#C97016;color:#fff;font-weight:700;text-decoration:none;padding:14px 26px;border-radius:14px}
p.small{font-size:15px;color:#6B5D48}
</style>
</head>
<body>
<main>
  <div class="sun">🌻</div>
  <h1>One moment…</h1>
  <p>Taking you to our secure Stripe checkout for the $1 Bright Patch unlock. Your code appears the moment you pay.</p>
  <a class="btn" id="go" href="https://buy.stripe.com/bJecN69Qu9kd7ou4WsgQE05">Continue to checkout →</a>
  <p class="small">Cards, Apple Pay, and Google Pay accepted. Payment is handled by Stripe; we never see your card number.</p>
</main>
<script>
(function(){
  var u = "https://buy.stripe.com/bJecN69Qu9kd7ou4WsgQE05";
  try{ var src = localStorage.getItem("bp-src"); if(src) u += "?client_reference_id=" + src; }catch(e){}
  document.getElementById("go").href = u;
  setTimeout(function(){ location.replace(u); }, 1500);
})();
</script>
</body>
</html>
